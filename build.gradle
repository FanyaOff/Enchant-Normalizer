plugins {
    id 'dev.kikugie.loom-back-compat'
    id 'maven-publish'
}

version = "${property('mod_version')}+${sc.current.version}"
group = property('maven_group')
base.archivesName = property('archives_base_name')

def javaVersion = sc.current.parsed >= '26.1' ? 25 : 21

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    if (sc.current.parsed < '26.1') {
        mappings "net.fabricmc:yarn:${property('yarn_mappings')}:v2"
    } else {
        loomx.applyMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', sc.current.version
    inputs.property 'loader_version', project.loader_version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_compat,
                loader_version: project.loader_version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
